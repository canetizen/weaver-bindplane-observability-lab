# Weaver Forge target that renders the Acme registry as human-readable reference
# documentation, so the schema has exactly one source and two consumers: code and docs.
whitespace_control:
  trim_blocks: true
  lstrip_blocks: true

params:
  schema_url: https://acme.example/schemas/0.2.0

templates:
  - template: "registry.md.j2"
    filter: >
      {
        registry_attributes: [.groups[] | select(.type == "attribute_group")],
        spans: [.groups[] | select(.type == "span")],
        events: [.groups[] | select(.type == "event")],
        metrics: [.groups[] | select(.type == "metric")],
        entities: [.groups[] | select(.type == "entity")]
      }
    application_mode: single
    file_name: "registry.md"
