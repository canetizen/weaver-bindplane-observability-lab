name: acme
description: >
  Telemetry schema for the Acme Shop demo system. Defines the spans, metrics,
  events and attributes that the gateway, checkout and payment services are
  allowed to emit.
schema_url: https://acme.example/schemas/0.2.0
dependencies:
  - schema_url: https://opentelemetry.io/schemas/1.43.0
    registry_path: https://github.com/open-telemetry/semantic-conventions@v1.43.0[model]
