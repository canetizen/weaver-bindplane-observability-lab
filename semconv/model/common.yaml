groups:
  - id: registry.acme.order
    type: attribute_group
    display_name: Acme Order Attributes
    brief: Attributes describing an order flowing through the Acme Shop.
    attributes:
      - id: acme.order.id
        type: string
        stability: development
        brief: Opaque identifier of the order, unique for the lifetime of the shop.
        examples: ["ord-8f21c4", "ord-0a77be"]
      - id: acme.order.item_count
        type: int
        stability: development
        brief: Number of distinct line items in the order.
        examples: [1, 3, 12]
      - id: acme.customer.tier
        type:
          members:
            - id: free
              value: "free"
              stability: development
              brief: Customer on the free plan.
            - id: plus
              value: "plus"
              stability: development
              brief: Customer on the paid self-serve plan.
            - id: enterprise
              value: "enterprise"
              stability: development
              brief: Customer on a negotiated enterprise contract.
        stability: development
        brief: Commercial tier of the customer that placed the order.

  - id: registry.acme.payment
    type: attribute_group
    display_name: Acme Payment Attributes
    brief: Attributes describing a payment authorization attempt.
    attributes:
      - id: acme.payment.method
        type:
          members:
            - id: card
              value: "card"
              stability: development
              brief: Credit or debit card.
            - id: wire
              value: "wire"
              stability: development
              brief: Bank wire transfer.
            - id: wallet
              value: "wallet"
              stability: development
              brief: Third-party digital wallet.
        stability: development
        brief: Instrument used to authorize the payment.
      - id: acme.payment.decline_reason
        type:
          members:
            - id: insufficient_funds
              value: "insufficient_funds"
              stability: development
              brief: The instrument did not have enough available balance.
            - id: fraud_suspected
              value: "fraud_suspected"
              stability: development
              brief: The risk engine rejected the attempt.
            - id: expired_card
              value: "expired_card"
              stability: development
              brief: The card is past its expiry date.
        stability: development
        brief: Why the payment authorization was declined.

  - id: registry.acme.pipeline
    type: attribute_group
    display_name: Acme Pipeline Attributes
    brief: >
      Attributes added by the collector pipeline rather than by application
      code. They are declared here because telemetry that the pipeline enriches
      is still telemetry the schema is responsible for.
    attributes:
      - id: acme.agent.name
        type: string
        stability: development
        brief: Name of the sidecar collector that first received the signal.
        examples: ["acme-gateway", "acme-payment"]
      - id: acme.pipeline.tier
        type:
          members:
            - id: agent
              value: "agent"
              stability: development
              brief: Sidecar collector running next to a service.
            - id: gateway
              value: "gateway"
              stability: development
              brief: Central collector that aggregates every agent.
        stability: development
        brief: Collector tier that last processed the signal.
      - id: acme.log.severity
        type: string
        stability: development
        brief: Severity text of the log records counted by a log-derived metric.
        examples: ["INFO", "WARN"]
      - id: acme.log.service_name
        type: string
        stability: development
        brief: Service whose log records a log-derived metric counted.
        examples: ["acme-payment"]

  - id: registry.acme.service
    type: attribute_group
    display_name: Acme Service Attributes
    brief: Attributes describing an Acme service instance.
    attributes:
      - id: acme.service.tier
        type:
          members:
            - id: edge
              value: "edge"
              stability: development
              brief: Public-facing service.
            - id: core
              value: "core"
              stability: development
              brief: Internal business-logic service.
        stability: development
        brief: Position of the service in the Acme deployment topology.
